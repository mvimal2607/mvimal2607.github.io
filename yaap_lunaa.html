<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YAAP File Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-2xl bg-white rounded-xl shadow-lg p-6">
            <h1 class="text-3xl font-bold text-gray-900 mb-2">YAAP File Manager</h1>
            <p class="text-gray-600 mb-6">For Realme GT Master Edition</p>
            <div id="assetsList" class="space-y-4">
                <div class="animate-pulse space-y-2">
                    <div class="h-6 bg-gray-200 rounded w-1/4"></div>
                    <div class="h-10 bg-gray-200 rounded"></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function fetchAssets() {
            const assetsList = document.getElementById("assetsList");
            try {
                const response = await fetch("https://api.github.com/repos/mvimal2607/YAAP_lunaa/releases");
                const releases = await response.json();
                
                if (!releases.length) {
                    assetsList.innerHTML = '<p class="text-gray-500">No releases available</p>';
                    return;
                }

                releases.sort((a, b) => new Date(b.published_at) - new Date(a.published_at));
                assetsList.innerHTML = '';

                releases.forEach((release, index) => {
                    const card = document.createElement("div");
                    card.className = "p-4 bg-gray-50 rounded-lg";
                    
                    const assetsHtml = release.assets.map(asset => `
                        <div class="flex justify-between items-center py-2">
                            <a href="${asset.browser_download_url}" class="text-blue-600 hover:underline flex items-center gap-2" download>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                                ${asset.name}
                            </a>
                            <span class="text-gray-500 text-sm">${asset.download_count} downloads</span>
                        </div>
                    `).join('');

                    card.innerHTML = `
                        <h3 class="text-lg font-semibold mb-3 flex items-center gap-2">
                            ${index === 0 ? '<span class="bg-green-500 text-white text-xs font-bold px-2 py-1 rounded">Latest</span>' : ''}
                            ${release.tag_name}
                        </h3>
                        ${assetsHtml}
                    `;
                    assetsList.appendChild(card);
                });
            } catch (error) {
                assetsList.innerHTML = '<p class="text-red-500">Failed to load releases</p>';
            }
        }
        fetchAssets();
    </script>
</body>
</html>
